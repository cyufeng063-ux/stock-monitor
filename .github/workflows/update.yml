name: 更新A股报告

on:
  schedule:
    # 北京时间周一至周五 9:30-15:30 每60分钟运行 (UTC时间需-8)
    # 9:30 CST = 1:30 UTC, 16:30 CST = 8:30 UTC
    - cron: '30 1,2,3,4,5,6,7,8 * * 1-5'
  # 也可以手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 拉取数据并生成报告
        run: python stock_monitor.py -o index.html --no-email

      - name: 提交更新
        run: |
          git config user.name "stock-bot"
          git config user.email "bot@stock.local"
          git add index.html
          git diff --staged --quiet || git commit -m "更新报告 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
